<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>起動中 - Claude Code Dashboard</title>
    <style>
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        font-family: "Segoe UI", -apple-system, sans-serif;
        background: #18181b;
        color: #f4f4f5;
        -webkit-app-region: drag;
        user-select: none;
      }
      .title {
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }
      .bar-track {
        width: 260px;
        height: 6px;
        border-radius: 999px;
        background: #3f3f46;
        overflow: hidden;
      }
      .bar-fill {
        height: 100%;
        width: 0%;
        background: #818cf8;
        border-radius: 999px;
        transition: width 0.2s ease-out;
      }
      .meta {
        display: flex;
        gap: 10px;
        font-size: 11px;
        color: #a1a1aa;
      }
      .meta .label {
        max-width: 200px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .slow {
        display: none;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        font-size: 12px;
        color: #e4e4e7;
      }
      .slow.shown {
        display: flex;
      }
      .slow .buttons {
        display: flex;
        gap: 8px;
        -webkit-app-region: no-drag;
      }
      .slow button {
        min-width: 72px;
        padding: 6px 14px;
        border-radius: 6px;
        border: 1px solid #52525b;
        background: #27272a;
        color: #f4f4f5;
        font: inherit;
        cursor: pointer;
      }
      .slow button.primary {
        background: #4f46e5;
        border-color: #6366f1;
      }
      .slow button:focus-visible,
      .early-quit:focus-visible {
        outline: 2px solid #a5b4fc;
        outline-offset: 2px;
      }
      /* 目安の前でもやめられるように、20秒を過ぎたら小さく出す（窓の枠が無く、常に手前にあるため） */
      .early-quit {
        display: none;
        padding: 2px 10px;
        border-radius: 6px;
        border: 1px solid #52525b;
        background: transparent;
        color: #a1a1aa;
        font: inherit;
        font-size: 11px;
        cursor: pointer;
        -webkit-app-region: no-drag;
      }
      .early-quit.shown {
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="title">Claude Code Dashboard を起動しています…</div>
    <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
    <div class="meta">
      <span id="percent">0%</span>
      <span class="label" id="label"></span>
      <span id="eta"></span>
    </div>
    <button type="button" class="early-quit" id="earlyQuitButton">やめる</button>
    <div class="slow" id="slow" role="alert">
      <span id="slowText">まだ準備中です</span>
      <div class="buttons">
        <button type="button" class="primary" id="waitButton">待つ</button>
        <button type="button" id="quitButton">やめる</button>
      </div>
    </div>
    <script>
      const bar = document.getElementById("bar")
      const percentEl = document.getElementById("percent")
      const labelEl = document.getElementById("label")
      const etaEl = document.getElementById("eta")
      const slowEl = document.getElementById("slow")
      const slowTextEl = document.getElementById("slowText")
      const earlyQuitEl = document.getElementById("earlyQuitButton")
      /** 小さい［やめる］を出すまでの秒 */
      const EARLY_QUIT_AFTER_SECONDS = 20
      let slowShown = false

      // 目安の時間を超えたら、終了せずに「まだ準備中です」と出し、待つ・やめるを選んでもらう(遅い PC のため)
      window.splashAPI?.onSlow(({ elapsedSeconds }) => {
        // 秒は下の1か所（eta）だけに出す
        slowShown = true
        slowTextEl.textContent = "まだ準備中です"
        slowEl.classList.add("shown")
        earlyQuitEl.classList.remove("shown")
        etaEl.textContent = `この画面が出てから${elapsedSeconds}秒`
        document.getElementById("waitButton").focus()
      })
      document.getElementById("waitButton").addEventListener("click", () => {
        slowShown = false
        slowEl.classList.remove("shown")
        window.splashAPI?.choose("wait")
      })
      document.getElementById("quitButton").addEventListener("click", () => {
        window.splashAPI?.choose("quit")
      })
      earlyQuitEl.addEventListener("click", () => {
        window.splashAPI?.choose("quit")
      })

      window.splashAPI?.onProgress(({ percent, label, etaSeconds, elapsedSeconds }) => {
        const p = Math.max(0, Math.min(100, percent))
        bar.style.width = p + "%"
        percentEl.textContent = Math.round(p) + "%"
        if (label) labelEl.textContent = label
        // 目安を過ぎたら「まもなく」とは言わず、この画面が出てからの時間を出す（秒はここ1か所だけ）
        etaEl.textContent =
          etaSeconds != null && etaSeconds > 1 && !slowShown
            ? `残り約${etaSeconds}秒`
            : elapsedSeconds != null
              ? `この画面が出てから${elapsedSeconds}秒`
              : ""
        if (!slowShown && elapsedSeconds != null && elapsedSeconds >= EARLY_QUIT_AFTER_SECONDS) earlyQuitEl.classList.add("shown")
      })
    </script>
  </body>
</html>
