appId: com.claudecodedashboard.app
productName: ClaudeCodeDashboard
directories:
  output: release
# electron/main.js とpackage.jsonのみをアプリ本体としてパッケージする。
# node_modulesやsrc/・config/（実際の個人パスを含むgitignore対象ファイル）等は
# ここに含めず、下のextraResourcesで必要なものだけを明示的にコピーする。
files:
  - electron/**/*
  - package.json
asar: true
extraResources:
  - from: .next/standalone/node_modules
    to: standalone/node_modules
  - from: .next/standalone/server.js
    to: standalone/server.js
  # .next/standalone/.next には、scripts/prepare-standalone.mjs が写した static も入っている
  # （npm run electron:dev と同じ写し方を使う。public/ を足したときは、standalone/public も同梱する）
  - from: .next/standalone/.next
    to: standalone/.next
  - from: config/projects.example.json
    to: seed/config/projects.example.json
win:
  target:
    - target: portable
      arch:
        - x64
artifactName: "${productName}-${version}-portable.exe"
portable:
  # 展開中（起動のたびに約25〜30秒。アプリのコードがまだ動いていない間）に出す画像（⑫ ST-14 (a)）。BMP だけ。
  # 効き目は exe で確かめる（出なければ、この portable の項目を外す）。文は README・使い方ガイドの案内と同じ
  splashImage: electron/portable-splash.bmp
  # 展開先を起動ごとに別の一時フォルダ（$PLUGINSDIR\app。%TEMP%\nsXXXX.tmp の中）にする。決まった名前のフォルダだと、
  # 起動の間に開き直したとき、2つ目が1つ目の動いているフォルダを消して上書きし、起動の失敗や 500 になる（99 の確かめ）。
  # 値は true。説明の文（scheme.json）は「false で $PLUGINSDIR」と書くが、25.1.8 のコード（app-builder-lib の
  # out/targets/nsis/NsisTarget.js 235〜237行）は false でもビルドの ksuid の決まった名前にし、true のときだけ $PLUGINSDIR になる。
  # electron-builder を上げるときは、この値の意味が変わっていないかを見直す
  unpackDirName: true
